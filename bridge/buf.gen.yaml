version: v2
managed:
  enabled: true
  override:
    - file_option: go_package
      path: emulator_controller.proto
      value: github.com/kartollikaa/claude-android-emulator/bridge/internal/emulatorpb
plugins:
  - local: ["go", "run", "google.golang.org/protobuf/cmd/protoc-gen-go@v1.36.12"]
    out: internal/emulatorpb
    opt: paths=source_relative
  - local: ["go", "run", "google.golang.org/grpc/cmd/protoc-gen-go-grpc@v1.6.1"]
    out: internal/emulatorpb
    opt: paths=source_relative
inputs:
  - directory: proto
