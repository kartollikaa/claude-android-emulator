<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Emulator</title>
<style>
  :root {
    --bg: #f5f4ef;
    --fg: #29261b;
    --muted: #8a877c;
    --button: #ffffff;
    --button-hover: #ebe9e1;
    --line: #dedcd3;
    --bezel: #1c1c1e;
    --focus: #2c84db;
    --accent: #c96442;
    --accent-fg: #ffffff;
    --error: #b3261e;
    --bezel-width: 8px;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #262624;
      --fg: #f2f1ec;
      --muted: #9b998f;
      --button: #30302e;
      --button-hover: #3b3b38;
      --line: #42413d;
      --bezel: #0b0b0c;
      --error: #f2b8b5;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); }
  body {
    display: flex; flex-direction: column; align-items: center; gap: 12px;
    padding: 16px; font: 13px/1.4 -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
    user-select: none; -webkit-user-select: none;
  }
  .device { position: relative; flex: 1; min-height: 0; width: 100%; display: flex; align-items: center; justify-content: center; }
  canvas {
    box-sizing: content-box; width: 0; height: 0;
    border: var(--bezel-width) solid var(--bezel); border-radius: 28px; background: var(--bezel);
    touch-action: none; cursor: default; outline: none;
  }
  canvas:focus-visible { box-shadow: 0 0 0 3px var(--focus); }
  .panel {
    position: absolute; inset: 0; display: none; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; text-align: center; color: var(--muted); padding: 24px; overflow: auto;
  }
  .panel strong { color: var(--fg); font-weight: 600; font-size: 15px; }
  .panel [hidden] { display: none !important; }
  body.offline canvas, body.offline nav, body.offline .toolbar { visibility: hidden; }
  body.offline .settings { display: none; }
  body.offline .panel { display: flex; }
  .progress { display: flex; flex-direction: column; align-items: center; gap: 8px; }
  .spinner {
    width: 28px; height: 28px; border-radius: 50%;
    border: 3px solid var(--line); border-top-color: var(--accent); animation: spin 0.9s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .picker { width: min(360px, 100%); display: flex; flex-direction: column; gap: 10px; text-align: left; }
  .picker h1 { margin: 0; font-size: 15px; font-weight: 600; color: var(--fg); }
  .error { margin: 0; padding: 8px 10px; border: 1px solid var(--error); border-radius: 10px; color: var(--error); overflow-wrap: anywhere; }
  .avds { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
  .avds li {
    display: flex; align-items: center; gap: 12px; padding: 10px 12px;
    border: 1px solid var(--line); border-radius: 12px; background: var(--button);
  }
  .avds .name { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  .avds .name b { color: var(--fg); font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .avds button {
    padding: 6px 14px; border: 0; border-radius: 8px; background: var(--accent); color: var(--accent-fg);
    font: inherit; font-weight: 600; cursor: pointer;
  }
  .avds button:disabled { background: var(--line); color: var(--muted); cursor: default; }
  .avds button:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
  nav, .toolbar { display: flex; flex-wrap: wrap; justify-content: center; gap: 8px; }
  .toolbar .group { display: flex; gap: 4px; }
  nav button, .toolbar button {
    width: 44px; height: 36px; display: grid; place-items: center; padding: 0;
    border: 1px solid var(--line); border-radius: 10px; background: var(--button); color: var(--fg); cursor: pointer;
  }
  nav button:hover, .toolbar button:hover { background: var(--button-hover); }
  nav button:focus-visible, .toolbar button:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  nav button:disabled, .toolbar button:disabled { opacity: 0.5; cursor: default; }
  nav svg, .toolbar svg { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .toolbar .recording { width: auto; padding: 0 10px; gap: 6px; display: flex; background: var(--error); border-color: var(--error); color: var(--bg); font: inherit; font-weight: 600; font-variant-numeric: tabular-nums; }
  .toolbar .recording svg { fill: currentColor; stroke: none; }
  .toolbar button[aria-expanded="true"] { background: var(--button-hover); border-color: var(--muted); }
  .settings {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: center; gap: 8px 16px; max-width: 100%;
    padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--button);
  }
  .settings[hidden] { display: none; }
  .settings label { display: flex; align-items: center; gap: 6px; }
  .settings select, .settings button {
    max-width: 220px; padding: 4px 8px; font: inherit; color: var(--fg); background: var(--bg);
    border: 1px solid var(--line); border-radius: 8px;
  }
  .settings button { cursor: pointer; }
  .settings button:hover { background: var(--button-hover); }
  .settings input { width: 16px; height: 16px; margin: 0; accent-color: var(--accent); }
  .settings :disabled { opacity: 0.6; cursor: default; }
  .settings.busy, .settings.busy * { cursor: progress; }
  .settings :focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .note { margin: 0; max-width: 100%; color: var(--muted); overflow-wrap: anywhere; text-align: center; }
  .note.error { padding: 0; border: 0; color: var(--error); }
  nav .power { margin-left: 16px; }
  nav .power.confirming { width: auto; padding: 0 12px; background: var(--error); border-color: var(--error); color: var(--bg); font: inherit; font-weight: 600; }
</style>
</head>
<body class="offline">
  <div class="toolbar">
    <div class="group">
      <button id="rotate-left" aria-label="Rotate left" title="Rotate left"><svg viewBox="0 0 24 24"><path d="M4 9a8 8 0 1 1 1.6 8.5"/><path d="M4 4v5h5"/></svg></button>
      <button id="rotate-right" aria-label="Rotate right" title="Rotate right"><svg viewBox="0 0 24 24"><path d="M20 9a8 8 0 1 0-1.6 8.5"/><path d="M20 4v5h-5"/></svg></button>
    </div>
    <div class="group">
      <button id="screenshot" aria-label="Take a screenshot" title="Screenshot"><svg viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg></button>
      <button id="record" aria-label="Record the screen" title="Record the screen"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="6"/></svg></button>
    </div>
    <div class="group">
      <button id="app-info" aria-label="App info of the app in front" title="App info"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8.5"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
      <button data-key="Power" aria-label="Power: turn the screen off or on" title="Power"><svg viewBox="0 0 24 24"><rect x="7" y="3" width="10" height="18" rx="2"/><path d="M11 18h2"/></svg></button>
    </div>
    <div class="group">
      <button id="settings" aria-label="Device settings" title="Device settings" aria-expanded="false" aria-controls="settings-panel"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
    </div>
  </div>
  <section class="settings" id="settings-panel" aria-label="Device settings" hidden>
    <label><input type="checkbox" id="dark-theme"> Dark theme</label>
    <label>Font size <select id="font-scale"></select></label>
    <label>Display size <select id="density"></select></label>
    <label>Language <select id="locale"></select></label>
    <button id="reset-settings" title="Light theme, default font and display size; the language stays">Reset</button>
  </section>
  <div class="device">
    <canvas id="screen" width="540" height="1200" tabindex="0" aria-label="Android screen: click to tap, drag to swipe, type to send keys"></canvas>
    <div class="panel">
      <div class="progress" id="progress" hidden>
        <div class="spinner"></div>
        <strong id="progress-title"></strong>
        <span id="progress-time"></span>
      </div>
      <div class="picker" id="picker" hidden>
        <p class="error" id="launch-error" hidden></p>
        <h1>Virtual devices</h1>
        <ul class="avds" id="avds"></ul>
        <span id="avds-empty" hidden>No virtual devices yet. Create one in Android Studio's Device Manager, then reload.</span>
      </div>
      <div class="progress" id="problem" hidden>
        <strong id="problem-title"></strong>
        <span id="problem-detail"></span>
      </div>
    </div>
  </div>
  <nav>
    <button data-key="GoBack" aria-label="Back" title="Back"><svg viewBox="0 0 24 24"><path d="M16 5 7 12l9 7z"/></svg></button>
    <button data-key="GoHome" aria-label="Home" title="Home"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="7"/></svg></button>
    <button data-key="AppSwitch" aria-label="Recents" title="Recents"><svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="1.5"/></svg></button>
    <button class="power" id="shutdown" aria-label="Shut down" title="Shut down"><svg viewBox="0 0 24 24"><path d="M12 4v7M7.5 7.2a7 7 0 1 0 9 0"/></svg></button>
  </nav>
  <p class="note" id="note" hidden></p>
<script>
  const canvas = document.getElementById('screen')
  const context = canvas.getContext('2d')
  let socket = null
  let image = null

  function connect() {
    socket = new WebSocket(`ws://${location.host}/live`)
    socket.binaryType = 'arraybuffer'
    socket.onopen = loadNames
    socket.onclose = () => {
      show('problem', { title: 'Connecting to the bridge…', detail: '' })
      setTimeout(connect, 1000)
    }
    socket.onmessage = ({ data }) => {
      if (typeof data === 'string') {
        const message = JSON.parse(data)
        if (message.type === 'state') render(message)
        return
      }
      draw(new DataView(data), new Uint8Array(data, 12))
    }
  }

  // Panels: the AVD list, start and boot progress, problems; the screen once the emulator has booted.
  const panels = { progress: el('progress'), picker: el('picker'), problem: el('problem') }
  let shown = null
  let progressSince = 0
  let names = {}
  let lastState = null

  function el(id) { return document.getElementById(id) }

  function render(state) {
    lastState = state
    showRecording(state)
    if (state.saved && seenSaved !== undefined && state.saved !== seenSaved) note(`Saved ${state.saved}`)
    seenSaved = state.saved || ''
    if (state.connected && state.booted) {
      // The emulator may be another one now, with other settings and languages.
      if (shown !== null) {
        localeNames = null
        if (!settingsPanel.hidden) loadSettings()
      }
      return show(null)
    }
    if (state.connected) return show('progress', { title: `Booting ${label(state.avd || state.serial)}` })
    if (state.launch?.phase === 'starting') return show('progress', { title: `Starting ${label(state.launch.avd)}` })
    show('picker', { error: state.launch?.phase === 'failed' ? state.launch.error : '' })
  }

  // Starting and booting share the progress panel, so its clock runs on from one to the other.
  function show(name, options = {}) {
    const entering = name !== shown
    shown = name
    if (name === 'progress' && entering) progressSince = Date.now()
    for (const [key, panel] of Object.entries(panels)) panel.hidden = key !== name
    document.body.classList.toggle('offline', name !== null)
    if (name === 'progress') { el('progress-title').textContent = options.title; tick() }
    if (name === 'problem') { el('problem-title').textContent = options.title; el('problem-detail').textContent = options.detail }
    if (name === 'picker') {
      el('launch-error').hidden = !options.error
      el('launch-error').textContent = options.error || ''
      if (entering) {
        drawnAVDs = ''
        loadAVDs()
      }
    }
  }

  const label = avd => names[avd] || avd || 'the emulator'

  function tick() {
    if (shown !== 'progress') return
    el('progress-time').textContent = `${Math.round((Date.now() - progressSince) / 1000)} s`
  }
  setInterval(tick, 1000)

  // Display names for the progress title, in case the page opens on an emulator already starting.
  async function loadNames() {
    try {
      const answer = await (await fetch('/avds')).json()
      names = Object.fromEntries((answer.avds || []).map(avd => [avd.name, avd.displayName]))
      if (shown === 'progress' && lastState) render(lastState)
    } catch {}
  }

  // An emulator shutting down still counts as running, so the list keeps itself fresh while shown.
  let drawnAVDs = ''
  setInterval(() => { if (shown === 'picker') loadAVDs() }, 3000)

  async function loadAVDs() {
    const list = el('avds')
    let answer
    try {
      const response = await fetch('/avds')
      answer = await response.json()
      if (shown !== 'picker') return
      if (!response.ok) return show('problem', { title: 'Android SDK not found', detail: answer.error })
    } catch (error) {
      if (shown === 'picker') show('problem', { title: 'Cannot list the virtual devices', detail: String(error) })
      return
    }
    names = Object.fromEntries(answer.avds.map(avd => [avd.name, avd.displayName]))
    if (JSON.stringify(answer.avds) === drawnAVDs && list.children.length) return
    drawnAVDs = JSON.stringify(answer.avds)
    el('avds-empty').hidden = answer.avds.length > 0
    list.replaceChildren(...answer.avds.map(avd => {
      const item = document.createElement('li')
      const name = document.createElement('span')
      name.className = 'name'
      const title = document.createElement('b')
      title.textContent = avd.displayName
      const detail = document.createElement('span')
      detail.textContent = [avd.api && `API ${avd.api}`, avd.running && 'running'].filter(Boolean).join(' · ') || avd.name
      name.append(title, detail)
      const start = document.createElement('button')
      start.textContent = 'Start'
      start.disabled = avd.running
      start.addEventListener('click', () => startAVD(avd.name, start))
      item.append(name, start)
      return item
    }))
  }

  async function startAVD(name, button) {
    button.disabled = true
    let problem = ''
    try {
      const response = await fetch('/emulators/start', {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify({ avd: name }),
      })
      if (!response.ok) problem = (await response.text()).trim()
    } catch (error) {
      problem = `Cannot reach the bridge: ${error}`
    }
    if (!problem) return
    el('launch-error').hidden = false
    el('launch-error').textContent = problem
    button.disabled = false
  }

  // Shut down asks once more on the button itself; a second press within a few seconds powers off.
  const shutdown = el('shutdown')
  let confirmTimer = 0
  shutdown.addEventListener('click', async () => {
    if (!shutdown.classList.contains('confirming')) {
      shutdown.classList.add('confirming')
      shutdown.textContent = 'Shut down?'
      confirmTimer = setTimeout(resetShutdown, 3000)
      return
    }
    resetShutdown()
    await fetch('/shutdown', { method: 'POST', headers: { 'content-type': 'application/json' }, body: '{}' }).catch(() => {})
  })
  const powerIcon = shutdown.innerHTML
  function resetShutdown() {
    clearTimeout(confirmTimer)
    shutdown.classList.remove('confirming')
    shutdown.innerHTML = powerIcon
  }

  // The toolbar: each control is one request; what it saved or why it failed shows in the note.
  let seenSaved
  let noteTimer = 0
  function note(text, isError = false) {
    clearTimeout(noteTimer)
    const line = el('note')
    line.textContent = text.charAt(0).toUpperCase() + text.slice(1)
    line.classList.toggle('error', isError)
    line.hidden = false
    noteTimer = setTimeout(() => { line.hidden = true }, 8000)
  }

  async function control(path, body = {}) {
    try {
      const response = await fetch(path, {
        method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(body),
      })
      if (!response.ok) note((await response.text()).trim() || `${path} failed`, true)
      return response.ok
    } catch (error) {
      note(`Cannot reach the bridge: ${error}`, true)
      return false
    }
  }

  async function busy(button, act) {
    button.disabled = true
    try { await act() } finally { button.disabled = false }
  }

  el('rotate-left').addEventListener('click', event => busy(event.currentTarget, () => control('/rotate', { direction: 'left' })))
  el('rotate-right').addEventListener('click', event => busy(event.currentTarget, () => control('/rotate', { direction: 'right' })))
  el('screenshot').addEventListener('click', event => busy(event.currentTarget, () => control('/screenshot')))
  el('app-info').addEventListener('click', event => busy(event.currentTarget, () => control('/app-settings')))

  const record = el('record')
  const recordIcon = record.innerHTML
  let recordingSince = 0
  record.addEventListener('click', () => busy(record, () => control(recordingSince ? '/recording/stop' : '/recording/start')))
  function showRecording(state) {
    const since = state.recordingSince ? Date.parse(state.recordingSince) : 0
    if (recordingSince && !since && state.recordingError) note(`The recording was not saved: ${state.recordingError}`, true)
    recordingSince = since
    record.classList.toggle('recording', recordingSince > 0)
    record.title = recordingSince ? 'Stop recording' : 'Record the screen'
    tickRecording()
  }
  function tickRecording() {
    if (!recordingSince) {
      if (record.innerHTML !== recordIcon) record.innerHTML = recordIcon
      return
    }
    const seconds = Math.max(0, Math.floor((Date.now() - recordingSince) / 1000))
    record.innerHTML = `<svg viewBox="0 0 24 24"><rect x="7" y="7" width="10" height="10" rx="1.5"/></svg>${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`
  }
  setInterval(tickRecording, 1000)

  // Device settings: the panel shows what the device reports, and every change answers with the settings read back.
  const settingsButton = el('settings')
  const settingsPanel = el('settings-panel')
  let settings = null
  let localeNames = null

  settingsButton.addEventListener('click', () => {
    const opening = settingsPanel.hidden
    settingsPanel.hidden = !opening
    settingsButton.setAttribute('aria-expanded', String(opening))
    if (opening) loadSettings()
  })
  el('dark-theme').addEventListener('change', event => changeSettings('/settings', { darkTheme: event.target.checked }))
  el('font-scale').addEventListener('change', event => changeSettings('/settings', { fontScale: Number(event.target.value) }))
  el('density').addEventListener('change', event => {
    const density = Number(event.target.value)
    changeSettings('/settings', { density: density === settings.physicalDensity ? 0 : density })
  })
  el('locale').addEventListener('change', event => changeSettings('/settings', { locale: event.target.value }))
  el('reset-settings').addEventListener('click', () => changeSettings('/settings/reset', {}))

  async function loadSettings() {
    await settingsRequest(() => fetch('/settings'))
    if (!localeNames && settings?.locale) loadLocales()
  }

  async function changeSettings(path, change) {
    const changed = await settingsRequest(() => fetch(path, {
      method: 'POST', headers: { 'content-type': 'application/json' }, body: JSON.stringify(change),
    }))
    if (!changed) await settingsRequest(() => fetch('/settings'))
  }

  // Requests run one at a time and only the newest answer is drawn, so a burst of changes does not fight the user.
  let settingsQueue = Promise.resolve()
  let newestSettingsRequest = 0
  function settingsRequest(request) {
    const id = ++newestSettingsRequest
    settingsQueue = settingsQueue.then(async () => {
      settingsPanel.classList.add('busy')
      try {
        const response = await request()
        if (!response.ok) {
          note((await response.text()).trim() || 'The device settings are unavailable', true)
          return false
        }
        const answer = await response.json()
        if (id === newestSettingsRequest) showSettings(answer)
        return true
      } catch (error) {
        note(`Cannot reach the bridge: ${error}`, true)
        return false
      } finally {
        if (id === newestSettingsRequest) settingsPanel.classList.remove('busy')
      }
    })
    return settingsQueue
  }

  function showSettings(answer) {
    settings = answer
    el('dark-theme').checked = settings.darkTheme
    showChoices(el('font-scale'), settings.fontScaleSteps, settings.fontScale, scale => `${Math.round(scale * 100)}%${scale === 1 ? ' (default)' : ''}`)
    showChoices(el('density'), settings.densitySteps, settings.density, densityLabel)
    showLocales()
  }

  // A value set elsewhere that is not one of Android's steps shows as Custom.
  function showChoices(select, steps, current, label) {
    const values = steps.includes(current) ? steps : [...steps, current].sort((a, b) => a - b)
    select.replaceChildren(...values.map(value => new Option(steps.includes(value) ? label(value) : `Custom: ${label(value)}`, String(value))))
    select.value = String(current)
  }

  function densityLabel(density) {
    const index = settings.densitySteps.indexOf(density)
    const base = settings.densitySteps.indexOf(settings.physicalDensity)
    if (index < 0 || base < 0) return `${density} dpi`
    const name = index < base ? 'Small' : index === base ? 'Default' : ['Large', 'Larger', 'Largest'][index - base - 1]
    return `${name}, ${density} dpi`
  }

  async function loadLocales() {
    try {
      const response = await fetch('/settings/locales')
      if (!response.ok) return
      const { locales } = await response.json()
      const names = new Intl.DisplayNames([navigator.language], { type: 'language' })
      // A tag with a -u- extension (a numbering system) is named after its language and told apart by the tag.
      const nameOf = tag => { try { return names.of(tag.split('-u-')[0]) || tag } catch { return tag } }
      const counts = {}
      for (const tag of locales) counts[nameOf(tag)] = (counts[nameOf(tag)] || 0) + 1
      localeNames = new Map(locales
        .map(tag => [tag, counts[nameOf(tag)] > 1 ? `${nameOf(tag)} · ${tag}` : nameOf(tag)])
        .sort((a, b) => a[1].localeCompare(b[1])))
      showLocales()
    } catch {}
  }

  function showLocales() {
    const select = el('locale')
    if (!settings.locale) {
      select.replaceChildren(new Option('Not available on this Android version', ''))
      select.disabled = true
      return
    }
    select.disabled = false
    const names = localeNames || new Map()
    const entries = names.has(settings.locale) ? [...names] : [[settings.locale, settings.locale], ...names]
    select.replaceChildren(...entries.map(([tag, name]) => new Option(name, tag)))
    select.value = settings.locale
  }

  function draw(header, rgb) {
    const width = header.getUint32(0, true)
    const height = header.getUint32(4, true)
    // An empty frame means the display went off: black out the screen, keep its size.
    if (!width || !height) {
      context.fillStyle = '#000'
      context.fillRect(0, 0, canvas.width, canvas.height)
      return
    }
    if (!image || image.width !== width || image.height !== height) {
      canvas.width = width
      canvas.height = height
      image = context.createImageData(width, height)
      fit()
    }
    const out = image.data
    for (let from = 0, to = 0; from < rgb.length; from += 3, to += 4) {
      out[to] = rgb[from]
      out[to + 1] = rgb[from + 1]
      out[to + 2] = rgb[from + 2]
      out[to + 3] = 255
    }
    context.putImageData(image, 0, 0)
  }

  // Scale the screen to the side that runs out first, so a resize never changes its proportions.
  const device = document.querySelector('.device')
  function fit() {
    const bezel = 2 * parseFloat(getComputedStyle(canvas).borderLeftWidth)
    const room = device.getBoundingClientRect()
    const scale = Math.max(0, Math.min((room.width - bezel) / canvas.width, (room.height - bezel) / canvas.height))
    canvas.style.width = `${Math.floor(canvas.width * scale)}px`
    canvas.style.height = `${Math.floor(canvas.height * scale)}px`
  }
  new ResizeObserver(fit).observe(device)

  const send = message => socket?.readyState === WebSocket.OPEN && socket.send(JSON.stringify(message))

  // The bezel is a border: fractions are taken over the content box, the screen itself.
  function at(event) {
    const box = canvas.getBoundingClientRect()
    const style = getComputedStyle(canvas)
    const border = parseFloat(style.borderLeftWidth)
    return {
      x: (event.clientX - box.left - border) / (box.width - 2 * border),
      y: (event.clientY - box.top - border) / (box.height - 2 * border),
    }
  }

  let isDown = false
  canvas.addEventListener('pointerdown', event => {
    if (event.button !== 0) return
    canvas.focus()
    canvas.setPointerCapture(event.pointerId)
    isDown = true
    send({ type: 'touch', phase: 'down', ...at(event) })
  })
  canvas.addEventListener('pointermove', event => {
    if (isDown) send({ type: 'touch', phase: 'move', ...at(event) })
  })
  function lift(event) {
    if (!isDown) return
    isDown = false
    send({ type: 'touch', phase: 'move', ...at(event) })
    send({ type: 'touch', phase: 'up', ...at(event) })
  }
  canvas.addEventListener('pointerup', lift)
  canvas.addEventListener('pointercancel', lift)

  const KEYS = {
    Enter: 'Enter', Backspace: 'Backspace', Delete: 'Delete', Tab: 'Tab', Escape: 'GoBack',
    ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown',
  }
  canvas.addEventListener('keydown', event => {
    if (event.metaKey || event.ctrlKey) return
    if (KEYS[event.key]) {
      send({ type: 'key', key: KEYS[event.key] })
      event.preventDefault()
    } else if (event.key.length === 1) {
      send({ type: 'text', text: event.key })
      event.preventDefault()
    }
  })
  canvas.addEventListener('paste', event => {
    const text = event.clipboardData?.getData('text/plain')
    if (text) send({ type: 'text', text })
    event.preventDefault()
  })
  document.querySelectorAll('[data-key]').forEach(button =>
    button.addEventListener('click', () => send({ type: 'key', key: button.dataset.key })))

  connect()
</script>
</body>
</html>
