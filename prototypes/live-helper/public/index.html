<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Android Live View</title>
<style>
  :root { --bg: #f4f4f5; --fg: #18181b; --muted: #71717a; --panel: #ffffff; --line: #e4e4e7; --accent: #16a34a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #0f0f11; --fg: #f4f4f5; --muted: #a1a1aa; --panel: #18181b; --line: #27272a; }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); font: 13px/1.4 -apple-system, system-ui, sans-serif; }
  body { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 12px 16px; }
  header { display: flex; gap: 8px; align-items: center; width: 100%; max-width: 520px; }
  header .title { font-weight: 600; }
  header .stat { margin-left: auto; color: var(--muted); font-variant-numeric: tabular-nums; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); }
  .dot.on { background: var(--accent); }
  .device { flex: 1; min-height: 0; display: flex; align-items: center; justify-content: center; width: 100%; }
  canvas { height: 100%; max-width: 100%; aspect-ratio: var(--ratio, 9 / 20); border-radius: 18px; border: 6px solid #000;
           background: #000; touch-action: none; cursor: pointer; outline: none; }
  canvas:focus-visible { box-shadow: 0 0 0 3px #3b82f680; }
  nav { display: flex; gap: 8px; }
  button { font: inherit; padding: 6px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--panel); color: var(--fg); cursor: pointer; }
  button:hover { border-color: var(--muted); }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
  <header>
    <span class="dot" id="dot"></span>
    <span class="title">Option A · live view</span>
    <span class="stat" id="stat">connecting…</span>
  </header>
  <div class="device"><canvas id="screen" tabindex="0" aria-label="Android screen: click to tap, drag to swipe, type to send keys"></canvas></div>
  <nav>
    <button data-key="GoBack">◀ Back</button>
    <button data-key="GoHome">● Home</button>
    <button data-key="AppSwitch">▢ Recents</button>
  </nav>
  <div class="hint">Click = tap · drag = swipe · click the screen, then type to send keys</div>
<script>
  const canvas = document.getElementById('screen')
  const context = canvas.getContext('2d')
  const stat = document.getElementById('stat')
  const dot = document.getElementById('dot')
  const flip = new URLSearchParams(location.search).has('flip')
  let socket = null
  let image = null
  let frames = 0
  let lastSeq = 0

  function connect() {
    socket = new WebSocket(`ws://${location.host}/live`)
    socket.binaryType = 'arraybuffer'
    socket.onopen = () => dot.classList.add('on')
    socket.onclose = () => { dot.classList.remove('on'); stat.textContent = 'reconnecting…'; setTimeout(connect, 1000) }
    socket.onmessage = ({ data }) => draw(new DataView(data), new Uint8Array(data, 12))
  }

  function draw(header, rgb) {
    const width = header.getUint32(0, true)
    const height = header.getUint32(4, true)
    lastSeq = header.getUint32(8, true)
    if (!image || image.width !== width || image.height !== height) {
      canvas.width = width
      canvas.height = height
      canvas.style.setProperty('--ratio', `${width} / ${height}`)
      image = context.createImageData(width, height)
    }
    const out = image.data
    for (let y = 0; y < height; y++) {
      const row = flip ? height - 1 - y : y
      let from = row * width * 3
      let to = y * width * 4
      for (let x = 0; x < width; x++, from += 3, to += 4) {
        out[to] = rgb[from]; out[to + 1] = rgb[from + 1]; out[to + 2] = rgb[from + 2]; out[to + 3] = 255
      }
    }
    context.putImageData(image, 0, 0)
    frames += 1
  }

  setInterval(() => { if (socket?.readyState === 1) stat.textContent = `${frames} fps · frame #${lastSeq}`; frames = 0 }, 1000)

  const send = message => socket?.readyState === 1 && socket.send(JSON.stringify(message))
  const at = event => {
    const box = canvas.getBoundingClientRect()
    return { x: (event.clientX - box.left) / box.width, y: (event.clientY - box.top) / box.height }
  }
  let isDown = false
  canvas.addEventListener('pointerdown', event => {
    canvas.focus()
    canvas.setPointerCapture(event.pointerId)
    isDown = true
    send({ type: 'touch', phase: 'down', ...at(event) })
  })
  canvas.addEventListener('pointermove', event => {
    if (isDown) send({ type: 'touch', phase: 'move', ...at(event) })
  })
  const lift = event => {
    if (!isDown) return
    isDown = false
    send({ type: 'touch', phase: 'move', ...at(event) })
    send({ type: 'touch', phase: 'up', ...at(event) })
  }
  canvas.addEventListener('pointerup', lift)
  canvas.addEventListener('pointercancel', lift)

  const KEYS = { Enter: 'Enter', Backspace: 'Backspace', Delete: 'Delete', Tab: 'Tab', Escape: 'GoBack',
                 ArrowLeft: 'ArrowLeft', ArrowRight: 'ArrowRight', ArrowUp: 'ArrowUp', ArrowDown: 'ArrowDown' }
  canvas.addEventListener('keydown', event => {
    if (event.metaKey || event.ctrlKey) return
    if (KEYS[event.key]) { send({ type: 'key', key: KEYS[event.key] }); event.preventDefault() }
    else if (event.key.length === 1) { send({ type: 'text', text: event.key }); event.preventDefault() }
  })
  document.querySelectorAll('[data-key]').forEach(button =>
    button.addEventListener('click', () => send({ type: 'key', key: button.dataset.key })))

  connect()
</script>
</body>
</html>
